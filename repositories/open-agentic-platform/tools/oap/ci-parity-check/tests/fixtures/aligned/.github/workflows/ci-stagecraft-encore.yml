# Aligned fixture for ci-parity-check tests (spec 104 §5.2 / spec 211 AC-4).
# The encore-lane run lines' significant tokens are all mirrored by the
# sibling Makefile's `ci-statecraft-encore` recipe → zero drift.
name: CI statecraft encore
on: [push]
jobs:
  encore-test:
    runs-on: ubuntu-latest
    steps:
      - run: node scripts/encore-test-lane.mjs list > /tmp/encore-lane-files.txt
      - run: node scripts/encore-test-lane.mjs check --report /tmp/encore-test-report.json
