# spec-spine.toml governs this repository: one corpus over the Rust umbrella
# at the root and the TypeScript members under members/ (spec 110).

[meta]
# Spec 109: the harness runs `spec-spine check`, the freshness verb 0.18.0
# added; an older binary reads its exit codes wrongly. Caret range.
required_version = "0.18.0"

[manifest]
# Drives the Cargo `[package.metadata.spec-spine].spec` and package.json
# `"spec-spine".spec` reads.
metadata_namespace = "spec-spine"

[domains]
allowed = []   # empty: the `domain` field is free-text / disabled

[kind]
allowed = []   # empty: the `kind` field is free-text / disabled

[layout]
specs_dir     = "specs"
derived_dir   = ".derived"
standards_dir = "standards/spec"
# The root is the umbrella crate; members/ is a standalone npm package (no
# workspaces) holding the three TypeScript members (spec 110 D-2).
standalone_npm_packages = ["members"]

[index]
# Governance surfaces beyond the always-hashed core. Every file a spec
# claims must sit in some content hash (L-008), and a directory glob has
# to end in `**/*` to match files rather than directories (L-010).
extra_hashed_inputs = [
  "standards/**/*",
  ".github/workflows/**/*",
  ".claude/agents/**/*",
  ".claude/rules/**/*",
  ".claude/skills/**/*",
  # Spec 118: the Codex face of the same kit.
  ".codex/**/*",
  ".agents/**/*",
  "scripts/**/*",
  ".claude/settings.json",
  ".mcp.json",
  "AGENTS.md",
  "CLAUDE.md",
  "Makefile",
  "README.md",
  "Cargo.lock",
  "install.sh",
  ".gitignore",
  "docs/**/*",
  "members/package.json",
  "members/tsconfig.json",
  "members/start.sh",
  "members/stop.sh",
  "members/scripts/**/*",
]

[coupling]
waiver_keyword = "Spec-Drift-Waiver:"
# FINDINGS.md is a research artifact consumed as data (000 §, formerly the
# observatory's bypass); bun.lock joins the floor's lockfile set.
bypass_prefixes = ["**/README.md", "members/FINDINGS.md", "members/bun.lock"]
# The ownership ratchet (spec 032 of spec-spine): a changed source file no
# spec specifically claims is C-002. Coverage is 100% as of spec 109.
require_ownership = true

[lint]
# The observatory corpus (000-043) claims its source by file, as it did for
# a year before L-008 existed. Folding 125 files into the global scalar would
# restamp every shard on every edit, and reclaiming them as symbol units is a
# sweep no one has run. The gap is recorded here as deliberate (spec 110
# D-4); `index check` still counts it. The Rust ports retire it file by file.
unwitnessed_allowed = ["members/src/**/*", "members/web/**/*", "members/scripts/**/*", "members/*"]
