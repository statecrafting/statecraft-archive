# ============================================================================
# Agent / LLM SDK watchlist (spec 210 FR-003)
# ============================================================================
#
# The falsifiability data behind the Build Spec `agentic_posture` declaration.
# When a produced application's governance certificate binds posture `none`
# (authored OR defaulted) yet its CycloneDX SBOM (spec 203, .factory/sbom.cdx.json)
# carries a dependency whose name matches an entry here, `verify-certificate`
# fails the cross-check with a diagnostic naming the package and the
# contradicted declaration. A dependency on a model-SDK family is not proof of
# an agent loop, but it is exactly the tripwire that forces the `none`
# declaration to be revisited.
#
# STATED RESIDUAL (spec 210 FR-003): a watchlist MISS is not proof of absence
# of agency. Absence of a match means "no KNOWN agent/LLM SDK in the tree", not
# "no agentic surface". The verifier reports a miss as a notice, never a silent
# pass. This list is deliberately non-exhaustive and versioned; extend it as
# the ecosystem grows.
#
# Matching is by CycloneDX `components[].name` (exact) or `components[].purl`
# (the package-name segment, tolerating the npm `%40` scope encoding). Produced
# apps are web applications today, so the list is npm-focused; add other
# ecosystems (pypi, cargo, ...) with an explicit `ecosystem` as produced-app
# stacks broaden.
#
# Schema version: 1.0.0
# ============================================================================

schema_version: "1.0.0"

