# spec-spine.toml governs this repository. All keys are optional; an absent
# file behaves as the defaults. Owned by spec 000; the governance-harness keys
# below are amended by spec 005 through an `extends` edge on this unit.

# Spec 005: the floor this repository is governed at. A FLOOR, not an exact
# pin: the failure guarded is one-directional (a binary older than the corpus
# it judges). `check` arrived in 0.18.0, and the session hooks, the Makefile
# and the CI workflow all call it, so a binary below the floor cannot answer
# the question the gate asks. `Config` derives `deny_unknown_fields`, so a
# binary predating this key fails to deserialize it and exits 3 with a config
# error rather than a misleading verdict.
[meta]
required_version = ">=0.18.0"

[manifest]
metadata_namespace = "spec-spine"

[domains]
allowed = []   # empty: the `domain` field is free-text / disabled

[kind]
allowed = []   # empty: the `kind` field is free-text / disabled

[layout]
specs_dir     = "specs"
derived_dir   = ".derived"
standards_dir = "standards/spec"

[index]
# Files folded into the global-inputs scalar, so a change to one stales every
# shard. Each pattern is deliberately narrow and ends in a file glob: in the
# `glob` crate `dir/**` matches DIRECTORIES only, so the earlier `standards/**`
# and `.claude/agents/**` forms here matched zero files and contributed no
# bytes to any hash. `spec-spine lint` now reports that as L-010; spec 005
# fixed all five.
#
# Narrow on purpose. A bare `.claude/**/*` would fold in `.DS_Store`,
# `agent-memory/` and `settings.local.json` and make the shard hashes
# machine-dependent. An entry here restales every shard when it changes, so it
# earns its place by being a governance file some spec claims.
extra_hashed_inputs = [
  "standards/**/*.md",
  ".github/workflows/*.yml",
  # The agentic harness (spec 005): editing what an agent may do stales the
  # ledger until the regenerated shards are committed.
  "AGENTS.md",
  "CLAUDE.md",
  ".claude/settings.json",
  ".claude/agents/*.md",
  ".claude/rules/*.md",
  ".claude/skills/*/*.md",
  ".mcp.json",
  "Makefile",
  ".githooks/*.sh",
  ".gitattributes",
]
# `.react-router/` is React Router's typegen output: gitignored, regenerated by
# `npm run typecheck`, and never authored. Indexing it put fourteen generated
# `.d.ts` files in the unclaimed column and made `require_ownership` below
# impossible to turn on honestly. The list replaces the built-in default
# rather than extending it, so the defaults are restated here.
resolver_exclusions = ["target", "node_modules", ".derived", "dist", "build", ".next", ".react-router", "public/data"]

[coupling]
waiver_keyword = "Spec-Drift-Waiver:"
# Additive to the built-in bypass floor (the root README, docs/, .github/,
# lockfiles, .derived/). `**/README.md` is a tail-suffix match that extends it
# to nested READMEs.
bypass_prefixes = ["**/README.md"]
# Spec 005: the ownership ratchet. A changed source file that no spec
# specifically claims is C-002 at PR time, and `index coverage
# --fail-on-untraced` refuses it in the gate. Turned on because coverage is
# 30/30 once the typegen output above is excluded: there is no debt to grandfather.
require_ownership = true
# Clear a change whose every non-bypassed path is a dependency-only manifest
# edit, with no other change in the diff. The waiver is mechanical, not a
# judgement: the CLI re-reads each manifest at base and at head and refuses to
# waive unless the only difference is dependency versions. Without it a
# Dependabot bump to package.json is unmergeable, since a restricted-token PR
# cannot add a `Spec-Drift-Waiver:` line to its own body.
auto_waive_dependency_only = true

[lint]
# Claimed paths this corpus deliberately leaves out of every content hash. A
# `file` unit carries no span, and only span-backing files enter a shard hash,
# so every source file claimed as a bare file unit is invisible to the ledger.
# Folding `app/**` into extra_hashed_inputs would restale all six shards on
# every routine page edit, which is the wrong trade for a tree of source.
#
# They are not undefended: the coupling gate refuses a changed source file
# whose owning spec did not change, and the ownership ratchet above refuses an
# unclaimed one. What the gap costs is narrower and worth writing down:
# `spec-spine check` will not call the index stale for an edit to one of these.
unwitnessed_allowed = ["app/**/*", "react-router.config.ts", "vite.config.ts"]
