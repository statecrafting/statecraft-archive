# Governance gate (spec 100, harness by spec 109): the same `make gate` chain
# a session runs locally, so the gate has one definition rather than two that
# drift. This is the spec-spine kit's govern.yml kept under the filename spec
# 100 established. The Rust stack gate (fmt, clippy, test, release build) is
# ci.yml (spec 102), so the kit's probe and build jobs are not duplicated here.
name: spec-spine

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  govern:
    runs-on: ubuntu-latest
    steps:
      # `fetch-depth: 0` because the coupling gate compares a base to a head,
      # and a shallow clone has neither.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 109 D-2: the release `[meta] required_version` names, not the latest.
      # A release the pin excludes refuses at exit 3 before the gate runs a
      # verb, so a new spec-spine would turn every PR red with no change in it.
      - name: Install spec-spine
        run: |
          version="$(sed -n 's/^required_version = "[=^]*\([0-9][0-9.]*\)"$/\1/p' spec-spine.toml)"
          test -n "$version" || { echo "spec-spine.toml pins no required_version"; exit 1; }
          curl -fsSL https://raw.githubusercontent.com/statecrafting/spec-spine/main/install.sh | SPEC_SPINE_VERSION="v$version" sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Read-only. `compile --check` and `index check` compare the committed
      # shards to the corpus without writing, so a stale tree is reported rather
      # than repaired: a gate that writes hides the defect it exists to find.
      - name: Governed loop
        run: make gate BASE=origin/${{ github.base_ref || 'main' }}
        if: github.event_name != 'pull_request'

      # The coupling gate needs a base and a head, so it runs on pull_request
      # only. The PR body goes to a file and reaches the gate through
      # `--pr-body`: a body containing a `Spec-Drift-Waiver:` line has no safe
      # shell quoting, and a file has no quoting at all.
      - name: Governed loop (pull request)
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr-body.txt"
          # --fail-on-unresolved is opt-in (spec 050); see the Makefile gate.
          spec-spine check --fail-on-warn
          spec-spine lint --fail-on-warn
          spec-spine index coverage --fail-on-untraced
          spec-spine couple --base "origin/${{ github.base_ref }}" --head HEAD --pr-body "$RUNNER_TEMP/pr-body.txt"
          # Spec 123 B-4: the Codex kit and its manifest match the Claude kit.
          python3 scripts/codex-kit.py --check
