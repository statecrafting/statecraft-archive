[package]
name = "deployd-api"
version = "0.1.1"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false   # internal workspace crate; binaries ship via release workflows, not crates.io

[[bin]]
name = "deployd-api"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hiqlite = { version = "~0.14", default-features = false, features = ["sqlite", "backup", "s3", "auto-heal"] }
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
tower-http = { version = "0.7", features = ["cors"] }
jsonwebtoken = { version = "10", features = ["aws_lc_rs"] }
reqwest = { version = "0.13", features = ["json"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
once_cell = "1"
kube = { version = "4", features = ["client", "runtime"] }
k8s-openapi = { version = "0.28", features = ["v1_32"] }

[package.metadata.oap]
spec = "073-axiomregent-unification"
