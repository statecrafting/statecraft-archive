# The members' stack gate (spec 110 B-4, D-3): the observatory's govern.yml
# minus the governance steps, which spec-spine.yml runs once over the whole
# tree. Everything here runs under members/, the bun project spec 110 moved.
name: members
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  members:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: members
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      # Spec 112 FR-003: the sensor parity test builds and runs the Rust
      # sensor beside the TypeScript one; the runner carries cargo.
      - name: Build the Rust sensor
        working-directory: .
        run: cargo build -p statecraft-sensor-claude --locked
      # Spec 113 FR-003: the journal parity test runs the Rust verifier and
      # exporter beside the TypeScript ones, and extends a chain from Rust.
      - name: Build the Rust journal
        working-directory: .
        run: cargo build -p statecraft-journal --locked && cargo build -p statecraft-journal --example append --locked
      # Spec 114 FR-003: the driver parity test runs both drivers over 014's
      # fixtures and drives the Rust one through 043's seam.
      - name: Build the Rust driver
        working-directory: .
        run: cargo build -p statecraft-driver-claude --locked
      # Spec 115: the Codex sensor is a member the umbrella discovers; its
      # manifest is checked here the way the TypeScript members' are.
      - name: Build the Codex sensor
        working-directory: .
        run: cargo build -p statecraft-sensor-codex --locked && ./target/debug/statecraft-sensor-codex --member-manifest
      # Spec 116 FR-003: the Codex driver test drives the Rust binary
      # through 043's seam over a fake codex script.
      - name: Build the Codex driver
        working-directory: .
        run: cargo build -p statecraft-driver-codex --locked && ./target/debug/statecraft-driver-codex --member-manifest
      # The synthesis tests scaffold a target with `spec-spine init` (spec 035);
      # the same binary the governance job installs, which 109 D-2 pins to the
      # release `[meta] required_version` names.
      - name: Install spec-spine
        working-directory: .
        run: |
          version="$(sed -n 's/^required_version = "[=^]*\([0-9][0-9.]*\)"$/\1/p' spec-spine.toml)"
          test -n "$version" || { echo "spec-spine.toml pins no required_version"; exit 1; }
          curl -fsSL https://raw.githubusercontent.com/statecrafting/spec-spine/main/install.sh | SPEC_SPINE_VERSION="v$version" sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      # Spec 024 FR-001: the SPA the daemon serves has to build in CI.
      - name: Build web UI
        run: bun run web:build
      # Spec 042 FR-006: the three member binaries build and answer for
      # themselves; spec 043 FR-005 reads the engine and driver bundles.
      - name: Build members
        run: |
          bun run build:member:sensor && ./dist/statecraft-sensor-claude --member-manifest
          bun run build:member:engine && ./dist/statecraft-engine --member-manifest
          bun run build:member:driver && ./dist/statecraft-driver-claude --member-manifest
      - name: Tests
        run: bun test
