[package]
name = "axiomregent"
publish = false   # internal workspace crate; binaries ship via release workflows, not crates.io
version = "0.4.0"
edition = "2024"

[[bin]]
name = "axiomregent"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1.0"
thiserror = "2"
url = "2.4"
walkdir = "2.4"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
regex = "1.10"
uuid = { version = "1.0", features = ["v4", "serde"] }
zstd = "0.13"
tempfile = "3.8"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1.0", features = ["full"] }
similar = "3.1.0"
lz4_flex = "0.13"
tar = "0.4.44"
log = "0.4.29"
env_logger = "0.11"
reqwest = { version = "0.13", features = ["json", "form"] }
octocrab = { version = "0.54", default-features = false, features = ["default-client", "follow-redirect", "retry", "rustls", "rustls-ring", "timeout", "tracing", "jwt-aws-lc-rs"] }
urlencoding = "2"
hiqlite = { version = "~0.14", default-features = false, features = ["sqlite", "dlock", "listen_notify_local", "auto-heal"] }
async-trait = "0.1"

featuregraph = { path = "../featuregraph" }
xray        = { path = "../xray", features = ["analysis-call-graph"] }
agent       = { path = "../agent" }
run         = { path = "../run" }
open_agentic_policy_kernel = { path = "../policy-kernel" }
tool-registry = { path = "../tool-registry" }
skill-factory = { path = "../skill-factory" }
fastembed   = "5"
kd-tree     = { version = "0.6", features = ["rayon", "serde"] }
typenum     = "1.17"
once_cell   = "1"
parking_lot = "0.12"
rayon       = "1"

[features]
default = ["transport-stdio", "resolver-local", "skills-core"]
transport-stdio = []
resolver-local  = []
skills-core     = []
deny-exec       = []
rmcp            = []

[package.metadata.oap]
spec = "073-axiomregent-unification"
