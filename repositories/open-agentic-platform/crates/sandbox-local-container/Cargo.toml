[package]
name = "sandbox-local-container"
publish = false   # internal workspace crate
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "Local-container sandbox backend — rootless Podman / Docker via bollard (spec 185)"
rust-version = "1.85"

[lib]
name = "sandbox_local_container"
path = "src/lib.rs"

[dependencies]
factory-engine = { path = "../factory-engine" }
factory-contracts = { path = "../factory-contracts" }
async-trait = "0.1"
thiserror = "2"
# bollard speaks the Docker Engine REST API. Both Docker Desktop /
# Docker Engine and rootless Podman expose this protocol on a Unix
# socket — see spec 185 §2.1.
bollard = "0.18"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "time", "fs", "net"] }
tracing = "0.1"
sha2 = "0.10"
base64 = "0.22"
walkdir = "2"
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }
tempfile = "3"
serde_json = "1"

[package.metadata.oap]
spec = "185-sandbox-local-container-backend"
