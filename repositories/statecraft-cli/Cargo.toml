[package]
name = "statecraft-cli"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Statecraft governance verbs as CLI subcommands for humans and an MCP server for agents."
repository = "https://github.com/statecrafting/statecraft-cli"
readme = "README.md"

# spec-spine couples this crate's code paths to its owning spec.
[package.metadata.spec-spine]
spec = "102-crate-scaffold"

# One binary named `statecraft` (spec 101: the OPC name retires).
[[bin]]
name = "statecraft"
path = "src/main.rs"

# The workspace (spec 111 B-7): the umbrella is the root package; the Rust
# members and the contract they share live under crates/, in doc 02 D30's
# order.
[workspace]
members = ["crates/*"]

[dependencies]
# The member contract (spec 111): the manifest, the codes, the envelope and
# the driver seam, one definition shared with every Rust member.
statecraft-contract = { path = "crates/statecraft-contract" }
# CLI parsing and shell completions (no async; that lands in spec 103).
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
# Serialization: stable JSON output shapes are API from the first verb.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
# Semantic-version comparison for the template upgrade verb (spec 106): the
# compat gate matches a target against the contract's `[requires]` range.
# Pure Rust, no TLS surface; keeps the tree rustls-only.
semver = "1"
# Error handling: anyhow for operational context, thiserror for the taxonomy.
anyhow = "1"
thiserror = "2"
# Platform-appropriate config paths.
directories = "6"
# Async runtime and HTTP client for the control-plane API (spec 103).
# rustls only, never native-tls (CLAUDE.md: no OpenSSL on customer machines).
tokio = { version = "1", features = ["rt-multi-thread", "time", "net"] }
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "cookies",
    "rustls-tls",
] }

# Signal forwarding to a dispatched member (spec 108 §6): `kill` and `signal`
# only, on unix only. Already in the tree through tokio; no new surface.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# Mock HTTP server so `cargo test` never gates on a live control plane (spec 103 §1).
httpmock = "0.7"
