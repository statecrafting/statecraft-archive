[package]
name = "statecraft-sensor-codex"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "The Codex sensor member: the observed root under $CODEX_HOME or ~/.codex, the classification table transcribed from FINDINGS, and the 042 manifest, over statecraft-sensor-core."
repository = "https://github.com/statecrafting/statecraft-cli"
publish = false

[package.metadata.spec-spine]
spec = "115-codex-sensor"

[[bin]]
name = "statecraft-sensor-codex"
path = "src/main.rs"

[dependencies]
statecraft-contract = { path = "../statecraft-contract" }
statecraft-sensor-core = { path = "../statecraft-sensor-core" }
regex = "1"
serde_json = "1"
