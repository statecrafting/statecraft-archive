[package]
name = "open_agentic_spec_lint"
publish = false   # internal workspace crate; binaries ship via release workflows, not crates.io
version = "0.1.0"
edition = "2024"
description = "Conformance lint (Feature 006) — optional W-xxx workflow warnings"
rust-version = "1.85"

[[bin]]
name = "spec-lint"
path = "src/main.rs"

[lib]
name = "open_agentic_spec_lint"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
open_agentic_spec_types = { path = "../../shared/spec-types" }
serde_yaml = "0.9"
toml = "0.8"

[dev-dependencies]
tempfile = "3.27.0"

[package.metadata.oap]
spec = "147-spec-kind-grammar"
