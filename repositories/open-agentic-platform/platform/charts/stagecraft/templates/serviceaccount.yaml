apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# statecraft-api and its migrate/seed-rauthy Job hooks never call the K8s
# API (deploys are delegated to deployd-api's HTTP API, not the K8s client).
automountServiceAccountToken: false
