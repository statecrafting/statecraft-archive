# Spec: 034-featuregraph-registry-scanner-fix
# Spec: 177-ci-orchestrator-pr-gate
#
# Featuregraph golden test — coverage workflow.
#
# `crates/featuregraph/tests/golden.rs::test_golden_graph` ingests the
# compiled spec registry as input (via the committed `.derived/spec-registry`
# shard trees, regenerated by `spec-spine compile` at the top of this job).
# Its actual input surface is therefore `specs/**`. The broader `ci-crates.yml` workflow
# also runs this test as part of `cargo test --workspace`, but its
# path filter omits `specs/**`, so a spec-only PR doesn't trigger it
# (see issue #192 for the accrual datapoint: drift accumulated #185 → #189
# silently and surfaced on #190).
#
# This workflow closes that gap by running ONLY the golden test, on
# every change to the test's actual inputs:
#
#   - specs/**                              (the registry's source)
#   - spec-spine.toml                       (the registry's config)
#   - crates/featuregraph/**                (the test code itself + golden)
#
# The broader `ci-crates.yml` continues to run the golden as part of the
# workspace test set when its trigger fires. This workflow is redundant
# on those PRs and authoritative on spec-only PRs. `make ci-strict`
# mirrors the broader path via `cargo test --workspace`; this workflow
# is intentionally NOT in `ci-parity-check`'s ENFORCING_WORKFLOWS (it's
# coverage, not new enforcement).

name: CI featuregraph golden

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  golden:
    runs-on: ubuntu-latest
    name: featuregraph / golden graph
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # pinned for rust-toolchain.toml lockstep
        with:
          toolchain: '1.95.0'

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          shared-key: featuregraph-golden

      # The golden test reads the committed `.derived/spec-registry` shards.
      # Install the spec-spine CLI and emit a fresh registry as a fixture
      # before running the test, mirroring ci-crates.yml's pre-compile pattern.
      - name: Install spec-spine CLI
        run: cargo install spec-spine-cli --version 0.10.0 --locked

      - name: Emit spec registry (test fixture)
        run: spec-spine compile

      - name: Run featuregraph golden test
        run: cargo test --manifest-path crates/featuregraph/Cargo.toml --test golden -- test_golden_graph
