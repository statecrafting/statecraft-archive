# Spec: 127-spec-code-coupling-workflow
# Spec: 177-ci-orchestrator-pr-gate
#
# PR-time gate: every diff path's current authority spec (derived from
# the relationship-graph per spec 130) must be edited in the same PR.
# Reads the committed .derived/codebase-index shard trees via the published
# spec-spine couple gate (spec 103 governed-read: the gate is the consumer).
# Empty-authority-by-rule patterns (formerly .github/spec-coupling-
# bypass.txt) are codified in spec 152 (path-co-authority) §3.2;
# explicit waivers via `Spec-Drift-Waiver: <reason>` line in PR body
# remain as the last-resort mechanism.
#
# Dispatched unconditionally from `.github/workflows/ci.yml` (spec 177
# §2.2 constitutional carve-out) — spec 127's contract is "every PR" by
# design.

name: CI spec/code coupling

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

env:
  CARGO_TERM_COLOR: always

jobs:
  coupling-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: '1.95.0'

      # Spec 217 deleted the in-tree engine; the published spec-spine CLI is
      # the coupling gate (couple) and the index staleness gate (index check),
      # reading the committed shard trees. rust-cache keeps the one-time
      # `cargo install spec-spine-cli` warm across runs.
      - name: Rust cache
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          shared-key: spec-code-coupling

      - name: Install spec-spine CLI
        run: cargo install spec-spine-cli --version 0.10.0 --locked

      - name: Index staleness gate
        run: spec-spine index check

      - name: Run coupling gate
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -u
          # Materialise the PR body to a file so the gate can grep waivers.
          body_file="$(mktemp)"
          printf '%s' "${PR_BODY:-}" > "$body_file"
          spec-spine couple --base "$BASE_SHA" --head "$HEAD_SHA" --pr-body "$body_file"
