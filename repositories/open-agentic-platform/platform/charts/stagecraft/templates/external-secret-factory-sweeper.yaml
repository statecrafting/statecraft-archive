{{/*
Spec 224 FR-004 (mirrors spec 143 FR-010) : per-purpose-credential mount
discipline for the factory-runs sweeper.

Provisions the K8s Secret `statecraft-factory-sweeper-credentials` from the
cluster SecretStore, exposing exactly two keys (`CLIENT_ID`, `CLIENT_SECRET`)
sourced from the `statecraft-factory-sweeper-client-id` /
`-client-secret` Key Vault entries.

Discipline: this Secret is the SOLE credential surface mounted into the
factory-runs sweeper CronJob's pod. A leaked credential here is bounded to
that one sweeper's surface (Rauthy client `statecraft-factory-sweeper-m2m-app`,
scope `platform:factory:sweep`). Same shape as the knowledge sweeper:
separate ExternalSecret per purpose, separate Secret per pod, no
cross-purpose mounts.

Activated only when the chart is run against an ESO-backed cluster
(`secrets.provider == "eso"`). On Hetzner (`secrets.provider == "k8s"`)
`setup.sh` materialises the same Secret directly via `kubectl create secret
generic` from `STATECRAFT_FACTORY_SWEEPER_CLIENT_ID/_SECRET`. Either path
produces the same Secret name + key shape so the CronJob template stays
cluster-agnostic.
*/}}
{{- if and .Values.secrets.enabled (eq (default "k8s" .Values.secrets.provider) "eso") }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: statecraft-factory-sweeper-credentials
  labels:
    app.kubernetes.io/name: factory-runs-staleness-sweeper
    app.kubernetes.io/part-of: statecraft
    spec.oap/id: "224-self-hosted-sweeper-cron-revival"
    spec.oap/fr: "FR-004"
spec:
  refreshInterval: {{ default "1h" .Values.secrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.secrets.storeRef.name }}
    kind: {{ default "ClusterSecretStore" .Values.secrets.storeRef.kind }}
  target:
    name: statecraft-factory-sweeper-credentials
    creationPolicy: Owner
  data:
    - secretKey: CLIENT_ID
      remoteRef:
        key: statecraft-factory-sweeper-client-id
    - secretKey: CLIENT_SECRET
      remoteRef:
        key: statecraft-factory-sweeper-client-secret
{{- end }}
