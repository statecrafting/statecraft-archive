# Spec: 047-governance-control-plane
# Spec: 177-ci-orchestrator-pr-gate
#
# CI for policy-kernel: check, clippy, and test.
# Dispatched from `.github/workflows/ci.yml` on PRs touching the
# policy-kernel crate (spec 177); manual via workflow_dispatch.

name: CI policy-kernel

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check-and-test:
    runs-on: ubuntu-latest
    name: check + clippy + test
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: CI policy-kernel
        uses: ./.github/actions/rust-ci
        with:
          manifest-path: crates/policy-kernel/Cargo.toml
          cache-shared-key: policy-kernel
