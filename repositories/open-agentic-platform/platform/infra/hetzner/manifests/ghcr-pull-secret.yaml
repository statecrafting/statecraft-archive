# Spec 214 FR-005: private-image pull secret for tenant Deployments.
#
# Tenant images live in private GHCR packages (spec 213 builds them). A pod
# can only pull them if its namespace holds a dockerconfigjson secret named
# `ghcr-pull` (the deployd-api dispatch default, helm.rs build_values renders
# `imagePullSecrets: [{name: ghcr-pull}]`).
#
# Mirrors the wildcard-TLS pattern (tenants-wildcard-certificate.yaml): this
# single source Secret carries kubernetes-reflector annotations, and reflector
# clones it into every namespace matching `reflection-auto-namespaces`. Tenant
# namespaces are created on demand by deployd-api at deploy time; reflector
# picks them up and clones the Secret without a per-namespace admin pass, so a
# fresh tenant namespace can pull a private image with zero manual steps
# (SC-005).
#
# The credential is injected out-of-band, like the other credential-carrying
# secrets in setup.sh (cloudflare-api-token, rauthy-secrets): setup.sh builds
# `${GHCR_PULL_DOCKERCONFIGJSON}` (base64 of the docker config JSON, from a GHCR
# username + a read:packages PAT), sed-substitutes it into this manifest, and
# `kubectl apply`s the result. No credential is committed. Token scope:
# `read:packages` on the platform's GHCR org only.
apiVersion: v1
kind: Secret
metadata:
  name: ghcr-pull
  # Replication source. Reflector watches all namespaces (auto-namespaces
  # `.+`) and clones from here; kube-system is always present and is not a
  # tenant namespace, so the source copy never collides with a tenant deploy.
  namespace: kube-system
  labels:
    oap.spec: "214-tenant-app-chart-supersession"
  annotations:
    # Source-side: allow this Secret to be reflected.
    reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
    # Catch-all auto-clone into every namespace (same scope as the wildcard
    # TLS secret). Narrow this regex later if tenant namespaces gain a label.
    reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
    reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: ".+"
type: kubernetes.io/dockerconfigjson
data:
  # base64 of the docker config JSON {"auths":{"ghcr.io":{"auth":"<base64
  # user:PAT>"}}}. `data` (not `stringData`) because the value is already
  # base64 and the raw JSON cannot be embedded in a quoted YAML scalar.
  # Materialised by setup.sh; never committed.
  .dockerconfigjson: "${GHCR_PULL_DOCKERCONFIGJSON}"
