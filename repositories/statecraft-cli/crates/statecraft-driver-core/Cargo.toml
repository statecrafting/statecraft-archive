[package]
name = "statecraft-driver-core"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "The provider-neutral half of a Statecraft driver: spawn, stream, deadline, kill, classification and the 043 protocol, with the provider's argv, parser, rules and models left to a thin crate."
repository = "https://github.com/statecrafting/statecraft-cli"
publish = false

[package.metadata.spec-spine]
spec = "114-driver-port"

[dependencies]
statecraft-contract = { path = "../statecraft-contract" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
libc = "0.2"
