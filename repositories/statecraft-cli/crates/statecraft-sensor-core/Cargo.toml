[package]
name = "statecraft-sensor-core"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "The provider-neutral half of a Statecraft sensor: the watcher, the event store, snapshots, redaction, formatting and the verbs, with the observed root and the classification table left to a thin provider crate."
repository = "https://github.com/statecrafting/statecraft-cli"
publish = false

[package.metadata.spec-spine]
spec = "112-sensor-port"

[dependencies]
statecraft-contract = { path = "../statecraft-contract" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The event store: the same schema the TypeScript sensor writes.
rusqlite = { version = "0.32", features = ["bundled"] }
# Filesystem notifications (FSEvents on macOS, inotify on Linux).
notify = "7"
regex = "1"
# Local-time rendering for the formatter's en-US forms (D-3).
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
libc = "0.2"
