# The governed loop (spec 000, harness adopted by spec 005).
#
# CI runs the same `make gate` chain a session runs locally, so the gate has
# one definition rather than two that drift. The command list in AGENTS.md
# under "Run the gate before every commit" is the third caller of the same
# chain.
name: spec-spine

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# The floor spec-spine.toml declares in [meta] required_version. A binary
# below it exits 3 with a config error rather than a misleading verdict.
env:
  SPEC_SPINE_VERSION: v0.18.0

jobs:
  govern:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 because the coupling gate compares a base to a head,
      # and a shallow clone has neither.
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Install spec-spine (prebuilt, pinned)
        run: |
          curl -fsSL https://raw.githubusercontent.com/statecrafting/spec-spine/main/install.sh | \
            SPEC_SPINE_VERSION="$SPEC_SPINE_VERSION" SPEC_SPINE_BIN_DIR="$HOME/.local/bin" sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Version floor
        run: spec-spine --version

      # Read-only throughout. `check` compares the committed shards to what the
      # corpus compiles to without writing, so a stale tree is reported rather
      # than repaired: a gate that writes hides the defect it exists to find.
      - name: Governed loop
        if: github.event_name != 'pull_request'
        run: make gate BASE=origin/main

      # The coupling gate needs a base and a head, so the PR form runs the
      # chain with an explicit base. The PR body goes to a file and reaches the
      # gate through --pr-body: a body containing a Spec-Drift-Waiver: line has
      # no safe shell quoting, and a file has no quoting at all.
      - name: Governed loop (pull request)
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          printf '%s' "${PR_BODY:-}" > "$RUNNER_TEMP/pr-body.txt"
          spec-spine check --fail-on-unresolved --fail-on-warn
          spec-spine lint --fail-on-warn
          spec-spine index coverage --fail-on-untraced
          spec-spine couple \
            --base "origin/${{ github.base_ref }}" \
            --head HEAD \
            --pr-body "$RUNNER_TEMP/pr-body.txt"

  # The stack gate, the same two commands AGENTS.md lists after the governance
  # floor. It runs on pull requests as well as pushes: deploy.yml builds only
  # what already reached main, which is too late to catch a break.
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build (bake registry + prerender)
        run: npm run build
        env:
          # The build-time bake reads the family's public repos; the default
          # token only raises the rate limit.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
