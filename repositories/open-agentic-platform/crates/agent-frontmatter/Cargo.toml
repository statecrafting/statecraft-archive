[package]
name = "agent-frontmatter"
publish = false   # internal workspace crate; binaries ship via release workflows, not crates.io
version = "0.1.0"
edition = "2024"
description = "Unified agent and skill frontmatter schema — spec 054"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
# Rust → TypeScript type mirror for statecraft's agent catalog (spec 111 §2.1).
# The derive has no runtime cost; bindings are written by a cargo test.
# `no-serde-warnings` silences ts-rs's "failed to parse serde attribute"
# emission for `#[serde(alias = "...")]` fields. The aliases are
# deserialise-only (canonical field name is the source of truth for
# the TS binding), so ts-rs ignoring them is the correct behavior;
# the warning is cosmetic noise across every dependent build.
ts-rs = { version = "12", features = ["serde-json-impl", "no-serde-warnings"] }

[package.metadata.oap]
spec = "054-agent-frontmatter-schema"
