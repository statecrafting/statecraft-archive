[package]
name = "statecraft-driver-claude"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "The Claude Code driver member: the argv, the env scrub, the stream-json parser, the transcript path, the model pair and the termination table, over statecraft-driver-core."
repository = "https://github.com/statecrafting/statecraft-cli"
publish = false

[package.metadata.spec-spine]
spec = "114-driver-port"

[[bin]]
name = "statecraft-driver-claude"
path = "src/main.rs"

[dependencies]
statecraft-contract = { path = "../statecraft-contract" }
statecraft-driver-core = { path = "../statecraft-driver-core" }
serde_json = "1"
regex = "1"
