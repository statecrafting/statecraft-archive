[package]
name = "sandbox-k8s"
publish = false   # internal workspace crate
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "K8s sandbox backend — kube-rs + PodSecurity + RuntimeClass selection (spec 186)"
rust-version = "1.85"

[lib]
name = "sandbox_k8s"
path = "src/lib.rs"

[dependencies]
factory-engine = { path = "../factory-engine" }
factory-contracts = { path = "../factory-contracts" }
async-trait = "0.1"
thiserror = "2"
# kube-rs is the canonical async Kubernetes client for Rust — spec 186 §2.1.
# `client` for the Client construction sequence (in-cluster + kubeconfig);
# `runtime` for the watcher stream used in lifecycle.rs.
kube = { version = "0.95", default-features = false, features = ["client", "rustls-tls", "runtime", "ws"] }
k8s-openapi = { version = "0.23", features = ["latest"] }
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "time", "fs", "net"] }
tokio-stream = "0.1"
futures-util = "0.3"
tracing = "0.1"
sha2 = "0.10"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
# Tar output-volume harvest (spec 186 §2.6 step 5). `kubectl cp`
# equivalents stream tar payloads over `pods/<name>/exec`.
tar = "0.4"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }
serde_json = "1"

[package.metadata.oap]
spec = "186-sandbox-k8s-backend"
