# The governed-loop CI workflow (spec 008), from the spec-spine kit's
# `govern.yml`. It replaces the hand-rolled `spec-spine.yml` this repository
# carried from spec 000, which pinned spec-spine v0.10.0 and ran a *writing*
# `spec-spine compile` as its first step: a gate that repairs the tree it is
# judging cannot report that the committed shards were stale (spec 046).
#
# The governed half runs the same `make gate` chain a session runs locally, so
# the gate has one definition rather than two that drift. The license gate and
# the TypeScript stack gate are this repository's additions to the kit shape.
#
# THE KIT'S PROBE JOB IS DELIBERATELY ABSENT HERE, and the reason it exists is
# worth keeping: GitHub rejects `hashFiles` in a job-level `if`, because the
# expression is evaluated before the workspace exists, so the only way to
# condition a job on "does this repository contain a Cargo.toml" is a probe job
# that publishes the answer as an output. Three adopters rediscovered that
# independently. This repository needs no probe because its layout is fixed:
# `package.json` is always at the root and a root `Cargo.toml` never appears
# (the Rust lives in four standalone workspaces under `addon/`). Do not
# "restore" the probe as `if: hashFiles('Cargo.toml') != ''`; that is the
# broken form.
#
# The addon compile matrix is not here. It is spec 007's `build.yml`, which is
# path-filtered to `addon/**` because a release-profile build of four napi-rs
# crates on three platforms is minutes, not seconds.
name: govern

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: govern-${{ github.ref }}
  cancel-in-progress: true

jobs:
  govern:
    runs-on: ubuntu-latest
    steps:
      # `fetch-depth: 0` because the coupling gate compares a base to a head,
      # and a shallow clone has neither.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Pinned, not floating. `/setup` tells a contributor that CI runs the
      # pinned binary and that a local pass on another version proves nothing,
      # so the pin has to be real here for that to be true. `spec-spine.toml`
      # carries the matching `[meta] required_version` floor, which refuses a
      # binary too old for these verbs at the call rather than answering with a
      # misleading exit code.
      - name: Install spec-spine (prebuilt, pinned)
        run: |
          curl -fsSL https://raw.githubusercontent.com/statecrafting/spec-spine/main/install.sh | \
            SPEC_SPINE_VERSION=v0.18.0 SPEC_SPINE_BIN_DIR="$HOME/.local/bin" sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Read-only. `check` compares the committed shards to the corpus without
      # writing, so a stale tree is reported rather than repaired.
      #
      # BOTH legs run `make gate`, never a copy of the four commands. The gate
      # has one definition, in `Makefile`, and the pull-request leg differs
      # only in the two values it passes in. A second copy of the chain here
      # is a second gate, and the two drift the first time one is edited.
      - name: Governed loop
        if: github.event_name != 'pull_request'
        run: make gate BASE=origin/${{ github.ref_name }}

      # The coupling gate needs a base and a head, so it reaches its real form
      # only on pull_request. The PR body goes to a file and reaches the gate
      # through `make gate PR_BODY=`: a body containing a `Spec-Drift-Waiver:`
      # line has no safe shell quoting, and a file has no quoting at all.
      - name: Governed loop (pull request)
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          printf '%s' "${PR_BODY:-}" > "$RUNNER_TEMP/pr-body.txt"
          make gate BASE="origin/${{ github.base_ref }}" PR_BODY="$RUNNER_TEMP/pr-body.txt"

      # No npm install: the license gate reads manifests and LICENSE files off
      # disk and depends on nothing outside node's standard library.
      - name: License gate (spec 001 section 3, spec 005 section 3.3)
        run: make licenses

  # The stack gate `AGENTS.md` names, so the list a session runs before every
  # commit and the list CI enforces are the same list. Rust hygiene
  # (`make fmt`, `make clippy`) is deliberately not here: three of the four
  # addon workspaces are not rustfmt-clean, and reformatting them is a change
  # to code owned by specs 003, 005 and 006.
  stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: make typecheck
      - run: make test
