{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "acme-vue-encore.serviceAccountName" . }}
  labels:
    {{- include "acme-vue-encore.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# Tenant app pods never call the K8s API.
automountServiceAccountToken: false
{{- end -}}
